<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js xr - Box Transform (Fixed)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<style>
			/* Gaya minimal untuk memastikan kanvas memenuhi viewport */
			body { margin: 0; overflow: hidden; }
			#info {
				position: absolute;
				top: 10px;
				width: 100%;
				text-align: center;
				z-index: 100;
				color: white;
				font-family: sans-serif;
			}
			a { color: #f0f0f0; }
		</style>
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> xr - Box Transform
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "./build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import { TransformControls } from 'three/addons/controls/TransformControls.js';
			import { XRButton } from 'three/addons/webxr/XRButton.js';
			import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

			let container;
			let camera, scene, renderer;
			let controller1, controller2, line;
			let raycaster;
			let controls, targetObject; // targetObject ditambahkan untuk referensi objek yang dikontrol

			init();

			function init() {

				// 1. Setup Dasar
				container = document.createElement( 'div' );
				document.body.appendChild( container );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x808080 );

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 10 );
				camera.position.set( 0, 1.6, 0 ); // Posisi awal untuk VR/AR (tinggi mata)

				// Lantai
				const floorGeometry = new THREE.PlaneGeometry( 6, 6 );
				// Perbaikan: ShadowMaterial harus memiliki 'transparent: true' agar berfungsi dengan baik
				const floorMaterial = new THREE.ShadowMaterial( { opacity: 0.25, transparent: true } );
				const floor = new THREE.Mesh( floorGeometry, floorMaterial );
				floor.rotation.x = - Math.PI / 2;
				floor.receiveShadow = true;
				scene.add( floor );

				// Pencahayaan
				scene.add( new THREE.HemisphereLight( 0xbcbcbc, 0xa5a5a5, 3 ) );
				const light = new THREE.DirectionalLight( 0xffffff, 3 );
				light.position.set( 0, 6, 0 );
				light.castShadow = true;
				light.shadow.mapSize.set( 4096, 4096 );
				scene.add( light );
				
				// 2. Objek yang Dikontrol (Kotak)
				const boxGeometry = new THREE.BoxGeometry( 0.4, 0.4, 0.4 ); 
				const boxMaterial = new THREE.MeshStandardMaterial( {
					color: 0x0077ff, 
					roughness: 0.7,
					metalness: 0.0
				} );

				targetObject = new THREE.Mesh( boxGeometry, boxMaterial ); // Tetapkan ke variabel global
				targetObject.position.set( 0, 0.2, -1 ); 
				
				targetObject.castShadow = true;
				targetObject.receiveShadow = true;

				scene.add( targetObject ); // Langsung tambahkan ke scene (tidak perlu 'group' jika hanya satu objek)


				// 3. Renderer dan XR
				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				renderer.xr.enabled = true; 
				container.appendChild( renderer.domElement );

				document.body.appendChild( XRButton.createButton( renderer ) );

				// 4. Pengaturan TransformControls
				controls = new TransformControls( camera, renderer.domElement );
				
				// Pasang TransformControls ke objek kubus
				controls.attach( targetObject );
				
				// Pastikan controls tidak mengganggu raycasting controller (default-nya ini sudah terjadi, tapi ini untuk kejelasan)
				controls.enabled = true;
				
				scene.add( controls.getHelper() );
				
				// 5. Pengaturan Controller XR
				controller1 = renderer.xr.getController( 0 );
				controller1.addEventListener( 'select', onSelect );
				controller1.addEventListener( 'selectstart', onControllerEvent );
				controller1.addEventListener( 'selectend', onControllerEvent );
				controller1.addEventListener( 'move', onControllerEvent );
				controller1.userData.active = false;
				scene.add( controller1 );

				controller2 = renderer.xr.getController( 1 );
				controller2.addEventListener( 'select', onSelect );
				controller2.addEventListener( 'selectstart', onControllerEvent );
				controller2.addEventListener( 'selectend', onControllerEvent );
				controller2.addEventListener( 'move', onControllerEvent );
				controller2.userData.active = true;
				scene.add( controller2 );

				const controllerModelFactory = new XRControllerModelFactory();

				// Controller Grip (untuk model visual controller)
				controllerGrip1 = renderer.xr.getControllerGrip( 0 );
				controllerGrip1.add( controllerModelFactory.createControllerModel( controllerGrip1 ) );
				scene.add( controllerGrip1 );

				controllerGrip2 = renderer.xr.getControllerGrip( 1 );
				controllerGrip2.add( controllerModelFactory.createControllerModel( controllerGrip2 ) );
				scene.add( controllerGrip2 );

				// Garis Raycaster
				const lineGeometry = new THREE.BufferGeometry().setFromPoints( [ new THREE.Vector3( 0, 0, 0 ), new THREE.Vector3( 0, 0, - 1 ) ] );
				line = new THREE.Line( lineGeometry );
				line.name = 'line';
				line.scale.z = 5;

				raycaster = new THREE.Raycaster();

				window.addEventListener( 'resize', onWindowResize );
			}

			// Mengambil semua objek yang bisa diinteraksi (dalam kasus ini, TransformControls dan Box)
			function getInteractableObjects() {
				// Kita hanya perlu objek kotak kita untuk raycasting
				return [ targetObject ];
			}


			// Fungsi Dipanggil Saat Tombol 'Select' Dipicu
			function onSelect( event ) {

				const controller = event.target;

				// Reset status aktif (perbaikan kecil)
				controller1.userData.active = (controller === controller1);
				controller2.userData.active = (controller === controller2);
				
				// Pasang atau hapus garis (line)
				controller1.remove( line );
				controller2.remove( line );
				controller.add( line );

				raycaster.setFromXRController( controller );

				const intersects = raycaster.intersectObjects( getInteractableObjects() ); 

				if ( intersects.length > 0 ) {
					// Jika objek diklik, pasang TransformControls
					controls.attach( intersects[ 0 ].object );
				} else {
					// Jika mengklik udara, lepas TransformControls
					controls.detach();
				}

			}

			// Fungsi Dipanggil Saat Aksi Controller Terjadi (selectstart/selectend/move)
			function onControllerEvent( event ) {

				const controller = event.target;

				if ( controller.userData.active === false ) return;

				// Gunakan raycaster milik TransformControls untuk menentukan apakah controller berinteraksi dengan gagang kontrol
				controls.getRaycaster().setFromXRController( controller );

				switch ( event.type ) {

					case 'selectstart':
						// Memberitahu TransformControls bahwa pointer telah ditekan
						controls.pointerDown( null );
						break;

					case 'selectend':
						// Memberitahu TransformControls bahwa pointer telah dilepas
						controls.pointerUp( null );
						break;

					case 'move':
						// Memberitahu TransformControls bahwa pointer sedang bergerak
						controls.pointerHover( null ); // Cek apakah controller berada di atas gagang kontrol
						controls.pointerMove( null ); // Pindahkan kontrol jika sedang dalam mode 'selectstart'
						break;

				}

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
